name: Test Docker and Build GO executable

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7

    - name: Install the JSON Schema CLI
      uses: sourcemeta/jsonschema@v16.2.0

    - name: Validate JSON schema
      run: jsonschema metaschema schemas/album.schema.json

    - name: Validate JSON files
      run: jsonschema validate schemas/album.schema.json $(find albums/*)

  docker:
    runs-on: ubuntu-latest
    steps:
    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v4

    - name: Build and push
      uses: docker/build-push-action@v7

  build:
    runs-on: ubuntu-latest
    needs: validate
    steps:
    - uses: actions/checkout@v7

    - name: Set up Go
      uses: actions/setup-go@v6
      with:
        go-version: '1.26'

    - name: Build
      run: go build -v -ldflags="-s -w" ./...

    - name: Test
      run: go test ./...

    - name: Create zip of build Go executable
      uses: actions/upload-artifact@v7
      with:
          name: lyrics-bot
          path: |
            midnight-lyrics-bot
            albums/*
            fonts/*
            images/*
            LICENSE
            README.md
