name: Build Go executable

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v6

    - name: Install the JSON Schema CLI
      uses: sourcemeta/jsonschema@v14.4.0

    - name: Validate JSON schema
      run: jsonschema metaschema schemas/album.schema.json

    - name: Validate JSON files
      run: jsonschema validate schemas/album.schema.json $(find albums/*)

  build:
    runs-on: ubuntu-latest
    needs: validate
    steps:
    - uses: actions/checkout@v6

    - name: Set up Go
      uses: actions/setup-go@v6
      with:
        go-version: '1.25'

    - name: Build
      run: go build -v -ldflags="-s -w" ./...

    - name: Create zip of build Go executable
      uses: actions/upload-artifact@v6
      with:
          name: lyrics-bot
          path: |
            midnight-lyrics-bot
            albums/*
            fonts/*
            images/*
            LICENSE
            README.md
